# Refreshes data/adzuna-internships.json every morning, so the app always
# shows current internships in every field. Runs in the public repository
# (brandonsam18/swipehire), which holds the Adzuna key as two secrets.
name: Fetch internships

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC, early morning in the US
  workflow_dispatch: # lets the Actions tab (or `gh workflow run`) start it by hand

permissions:
  contents: write

concurrency:
  group: fetch-internships

jobs:
  fetch:
    # This file is also in the course repository, which has no key; only the public one fetches.
    if: github.repository == 'brandonsam18/swipehire'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from Adzuna
        run: node scripts/fetch-adzuna.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/adzuna-internships.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh internships from Adzuna"
            git push
          fi
